plugins {
    alias(libs.plugins.android.library)
}

// 读取 local.properties
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

def propertyOrDefault = { String key, String defaultValue ->
    def value = localProps.getProperty(key)
    return value == null || value.trim().isEmpty() ? defaultValue : value.trim()
}

def ensureTrailingSlash = { String value ->
    return value.endsWith("/") ? value : "${value}/"
}

def buildConfigString = { String value ->
    def escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${escaped}\""
}

def debugBaseUrl = ensureTrailingSlash(propertyOrDefault(
        'REMEMO_DEBUG_BASE_URL',
        'http://192.168.110.225:9090/'
))
def releaseBaseUrl = ensureTrailingSlash(propertyOrDefault(
        'REMEMO_RELEASE_BASE_URL',
        'https://example.invalid/'
))
android {
    namespace 'com.ggg.rememo.core.network'
    compileSdk {
        version = release(libs.versions.compileSdk.get().toInteger())
    }

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField("String", "DEEPSEEK_API_KEY", "\"${localProps.getProperty('DEEPSEEK_API_KEY', '')}\"")
    }

    buildTypes {
        debug {
            buildConfigField("String", "BASE_URL", buildConfigString(debugBaseUrl))
        }

        release {
            minifyEnabled false
            buildConfigField("String", "BASE_URL", buildConfigString(releaseBaseUrl))
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(":core:common")
    implementation project(":core:data")

    implementation libs.eventbus

    implementation libs.appcompat
    implementation libs.material
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.gson
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
